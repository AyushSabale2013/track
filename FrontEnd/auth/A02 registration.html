<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — TrackAcademy</title>
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/register.css" />
</head>

<body>

    <div id="navbar"></div>






    <div class="split-layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="brand">
                <img src="../assets/images/navLogo.png" alt="TrackAcademy Logo" class="brand-logo" />
                <span class="brand-name">TrackAcademy</span>
            </div>

            <div class="left-content">
                <p class="eyebrow">Start your journey</p>
                <h1 class="headline">Learn without<br /><span class="accent">limits.</span></h1>
                <p class="subtext">Join thousands of students building real skills with expert-led courses.</p>
            </div>

            <div class="left-footer">
                <div class="stat">
                    <span class="stat-num">12k+</span>
                    <span class="stat-label">Students enrolled</span>
                </div>
                <div class="divider-v"></div>
                <div class="stat">
                    <span class="stat-num">98%</span>
                    <span class="stat-label">Completion rate</span>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="form-card">
                <h2 class="form-title">Create your account</h2>
                <p class="form-sub">Already have an account? <a href="../auth/A01 login.html" class="link">Sign
                        in</a></p>

                <!-- ── Inline Message Banner (replaces all alerts) ── -->
                <div class="form-message" id="formMessage" style="display:none;"></div>

                <form id="registerForm" novalidate>

                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Ayush Sabale" autocomplete="name"
                            required />
                        <span class="field-error" id="name-error"></span>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="ayush@example.com" autocomplete="email"
                            required />
                        <span class="field-error" id="email-error"></span>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" autocomplete="tel"
                            required />
                        <span class="field-error" id="phone-error"></span>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password" placeholder="Min. 8 characters"
                                autocomplete="new-password" required />
                            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="password-error"></span>

                        <!-- Password strength bar -->
                        <div class="strength-bar" id="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-label" id="strength-label"></span>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                placeholder="Re-enter your password" autocomplete="new-password" required />
                            <button type="button" class="toggle-pw" id="toggleConfirmPw" aria-label="Show password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="confirmPassword-error"></span>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">

                        <span id="btn-text">Create Account</span>
                        <span id="btn-loader" class="loader hidden"></span>
                    </button>

                </form>

                <p class="terms">
                    By registering, you agree to our
                    <a href="../landing/000 page not available.html" class="link">Terms of Service</a> and
                    <a href="../landing/000 page not available.html" class="link">Privacy Policy</a>.
                </p>
            </div>
        </div>

    </div>

    <!-- Popup Notification
    <div id="popup" class="popup-overlay hidden">
        <div class="popup-box">
            <span id="popup-icon"></span>
            <p id="popup-message"></p>
        </div>
    </div> -->


    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
    <script type="module" src="../js/register.js"></script>

</body>

</html>
