<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="navbar"></div>



    <!-- admin's login login  -->
    <div class="student-body">
        <div class="login-container">
            <div class="login-header">
                <img src="/H01 Track logo.png" alt="Academy Logo" class="academy-logo">
                <h2>Admin Login</h2>
            </div>
            <form class="login-form">
                <div class="input-group">
                    <label for="admin-username">Admin ID or Email</label>
                    <input type="text" id="admin-username" name="admin-username"
                        placeholder="Enter your Admin ID or Email" required>
                </div>
                <div class="input-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" name="admin-password" placeholder="Enter your Password"
                        required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="admin-remember" name="admin-remember">
                    <label for="admin-remember">Remember Me</label>
                </div>
                <button type="submit" class="login-button">
                    <a href="/000 page not available.html" class="change_anchor_decoration_white">Login</a>
                </button>
                <div class="links">
                    <a href="/000 page not available.html">Forgot Password?</a>
                    <span>|</span>
                    <a href="/H13 inquiry.html">Need Help? Contact Support</a>
                </div>
            </form>
        </div>
    </div>



    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
</body>
</html>
