<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="navbar"></div>



    <!-- login  -->
    <div class="student-body">
        <div class="login-container">
            <div class="login-header">
                <img src="../assets/images/navLogo.png" alt="Academy Logo" class="academy-logo">
                <h2>Track Academy</h2>
            </div>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Roll Number or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your Roll No. or Email"
                        required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <button type="submit" class="login-button">
                    Login
                </button>
                <div class="links">
                    <a href="../landing/000 page not available.html">Forgot Password?</a>
                    <span>|</span>
                    <a href="../auth/A02 registration.html">New Student? Register Here</a>
                </div>
            </form>
        </div>
    </div>




    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
