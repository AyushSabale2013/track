<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>enqiury form</title>
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/H13 inquiry.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="navbar"></div>



    <!-- inquiry form -->
    <div class="form-container">
        <h2>Inquiry Form - Track JEE/NEET Academy</h2>
        <p>Please fill in your details and we will get back to you shortly.</p>

        <form class="inquiry-form">
            <div class="form-group">
                <label for="name">Full Name<span>*</span></label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email<span>*</span></label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number<span>*</span></label>
                <input type="tel" id="phone" name="phone" required placeholder="10-digit phone number">
            </div>

            <div class="form-group">
                <label for="course">Course Interested<span>*</span></label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="jee">JEE</option>
                    <option value="neet">NEET</option>
                    <option value="nda">NDA</option>
                    <option value="cet">CET</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4"
                    placeholder="Any specific queries or details?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </div>



    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
</body>

</html>
