<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage of Student</title>
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/T08 anouncement.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="navbar"></div>



    <!--Main content  -->

    <div class="body-background">
        <div class="announcement-wrapper">
            <!-- Announcement Form -->
            <div class="make-announcement">
                <h2> Create New Announcement</h2>
                <label for="announcement-title">Title:</label>
                <input type="text" id="announcement-title" placeholder="Enter announcement title">

                <label for="announcement-content">Message:</label>
                <textarea id="announcement-content" placeholder="Write your announcement here..."></textarea>

                <label for="announcement-author">Author Name:</label>
                <input type="text" id="announcement-author" placeholder="e.g. Prof. Mohit Sir ">

                <button onclick="submitAnnouncement()"> Post Announcement</button>
            </div>

            <!-- View Past Announcements -->
            <div class="previous-announcements">
                <h2> Posted Announcements</h2>

                <div class="announcement-item">
                    <strong>Mid-Term Exam Starts 25th July</strong>
                    <span>Date: 19 July 2025</span>
                    <span>Author: Mohit Sir</span>
                </div>

                <div class="announcement-item">
                    <strong>Mock Test Schedule Updated</strong>
                    <span>Date: 12 July 2025</span>
                    <span>Author: Prof. Prem Sir </span>
                </div>

                <div class="announcement-item">
                    <strong>Notes for Chapter 5 Uploaded</strong>
                    <span>Date: 9 July 2025</span>
                    <span>Author: Prof. Prem Sir</span>
                </div>
            </div>
        </div>
    </div>


    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
</body>

</html>
