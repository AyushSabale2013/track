<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );
        }

        .container {
            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            padding: 60px 80px;

            border-radius: 20px;

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.3);

            animation: fadeIn 1s ease;
        }

        h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 15px;

            animation: glow 2s infinite alternate;
        }

        p {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;

            padding: 12px 30px;

            background: linear-gradient(
                135deg,
                #06b6d4,
                #2563eb
            );

            color: white;

            border-radius: 50px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 10px rgba(59,130,246,0.5);
            }

            to {
                text-shadow:
                    0 0 25px rgba(59,130,246,1),
                    0 0 40px rgba(6,182,212,0.8);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome Admin 👑</h1>

        <p>
            Authentication Successful
        </p>

        <div class="badge">
            ADMIN ACCESS GRANTED
        </div>

    </div>

</body>
</html>
